# MongoDB for IdentiCare. Windows has no native mongod here, so Docker it is.
#   docker compose -f backend/docker-compose.yml up -d
services:
  mongo:
    image: mongo:7
    container_name: identicare-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: identicare
      MONGO_INITDB_ROOT_PASSWORD: identicare
    volumes:
      - identicare_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: identicare-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://identicare:identicare@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  identicare_mongo_data:

line-length = 110
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.isort]
known-first-party = ["app", "_bootstrap_path"]

[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
]

[lint.per-file-ignores]
"scripts/seed_articles.py" = ["E501"]
"scripts/*.py" = ["E402"]
